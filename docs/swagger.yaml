basePath: /api/v1
definitions:
  models.CostSummaryResponse:
    properties:
      total_cost:
        example: 4800
        type: integer
    type: object
  models.CreateSubscriptionRequest:
    properties:
      end_date:
        example: 07-2026
        type: string
      price:
        example: 400
        minimum: 1
        type: integer
      service_name:
        example: Yandex Plus
        type: string
      start_date:
        example: 07-2025
        type: string
      user_id:
        example: 60601fee-2bf1-4721-ae6f-7636e79a0cba
        type: string
    required:
    - price
    - service_name
    - start_date
    - user_id
    type: object
  models.ErrorNotFoundResponse:
    properties:
      error:
        example: Not found
        type: string
    type: object
  models.ErrorRequestResponse:
    properties:
      error:
        example: Invalid request
        type: string
    type: object
  models.ErrorServerResponse:
    properties:
      error:
        example: Internal server error
        type: string
    type: object
  models.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Subscription'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  models.Subscription:
    properties:
      created_at:
        type: string
      end_date:
        description: MM-YYYY
        type: string
      id:
        type: string
      price:
        type: integer
      service_name:
        type: string
      start_date:
        description: MM-YYYY
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.UpdateSubscriptionRequest:
    properties:
      end_date:
        example: 07-2026
        type: string
      price:
        example: 400
        minimum: 1
        type: integer
      service_name:
        example: Yandex Plus
        type: string
      start_date:
        example: 07-2025
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for managing user subscriptions
  title: Subscriptions API
  version: "1.0"
paths:
  /cost/summary:
    get:
      description: Calculates the total cost of subscriptions per period with filtering
      parameters:
      - description: User ID
        format: uuid
        in: query
        name: user_id
        type: string
      - description: Service name
        in: query
        name: service_name
        type: string
      - description: Start month
        format: MM- YYYY
        in: query
        name: start_month
        required: true
        type: string
      - description: End month
        format: MM-YYYY
        in: query
        name: end_month
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CostSummaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorServerResponse'
      summary: Calculate total cost
      tags:
      - subscriptions
  /subscriptions:
    get:
      description: Gets a list of subscriptions with pagination and filtering
      parameters:
      - description: User ID
        format: uuid
        in: query
        name: user_id
        type: string
      - description: Service name
        in: query
        name: service_name
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorServerResponse'
      summary: Get a list of subscriptions
      tags:
      - subscriptions
    post:
      consumes:
      - application/json
      description: Creates a new user subscription
      parameters:
      - description: Subscription data
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/models.CreateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Subscription'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorRequestResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorServerResponse'
      summary: Create a subscription
      tags:
      - subscriptions
  /subscriptions/{id}:
    delete:
      description: Deletes subscription by ID
      parameters:
      - description: subscription ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorServerResponse'
      summary: Delete Subscription
      tags:
      - subscriptions
    get:
      description: Gets subscriptions by ID
      parameters:
      - description: subscription ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Subscription'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorServerResponse'
      summary: Get Subscription
      tags:
      - subscriptions
    put:
      consumes:
      - application/json
      description: Updates an existing subscription
      parameters:
      - description: Subscription ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Update data
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/models.UpdateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Subscription'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorServerResponse'
      summary: Update Subscription
      tags:
      - subscriptions
swagger: "2.0"
